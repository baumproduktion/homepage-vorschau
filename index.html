<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tobias Baum – Vorschau</title>
<link rel="stylesheet" href="hell/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: #F4F1EA; color: #1B1B1B; font: 16px/1.6 Inter, system-ui, sans-serif; }
  main { width: 100%; max-width: 760px; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: clamp(36px, 7vw, 60px); line-height: 1; letter-spacing: -.03em; }
  p { color: #5F5B55; margin: 14px 0 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  a { display: block; text-decoration: none; color: inherit; border-radius: 18px; overflow: hidden; border: 1px solid #E2DDD2; background: #fff; transition: transform .15s; }
  a:hover { transform: translateY(-3px); }
  .sw { height: 150px; display: flex; align-items: flex-end; padding: 18px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 28px; line-height: .95; letter-spacing: -.02em; }
  .b { padding: 14px 18px 18px; }
  .b b { font-family: "Bricolage Grotesque", sans-serif; font-size: 20px; display: block; }
  .b span { font-size: 14px; color: #5F5B55; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Tobias Baum<br>Homepage-Vorschau</h1>
  <p>Zwei Design-Varianten mit denselben Inhalten. Einfach anklicken und ansehen.</p>
  <div class="grid">
    <a href="dunkel/">
      <div class="sw" style="background:#080B12;color:#F1EFEA">Video.<br>Musik. <span style="color:#FF6A2B">&nbsp;Stimme.</span></div>
      <div class="b"><b>Dunkel · „Set-Licht“</b><span>Filmisch, mit Drehfotos vom Set</span></div>
    </a>
    <a href="hell/">
      <div class="sw" style="background:#F4F1EA;color:#1B1B1B">Video.<br>Musik. <span style="color:#D9481C">&nbsp;Stimme.</span></div>
      <div class="b"><b>Hell · „Creme &amp; Orange“</b><span>Klar und warm, mit Porträt</span></div>
    </a>
  </div>
</main>
</body>
</html>
